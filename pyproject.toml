[project]
name = "daily-seo-reviewer"
version = "0.1.0"
description = "Evidence-backed daily technical SEO health reviews"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2==3.1.6",
    "lxml==6.1.3",
    "openai==3.46.0",
    "protego==0.7.0",
    "pydantic==2.14.3",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
