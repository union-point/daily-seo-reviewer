name: Integration preflight

on:
  workflow_dispatch:
    inputs:
      publish_smoke:
        description: Deploy initial smoke page (replaces the report site)
        type: boolean
        default: false
      model:
        description: Optional model override (defaults to repository OPENAI_MODEL variable)
        required: false
        type: string

# This gate is manual. Add the daily schedule only after the full review exists.
concurrency:
  group: daily-seo-reviewer-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --frozen pytest
      - name: Probe site and schema-validated model access
        id: probe
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model || vars.OPENAI_MODEL || 'gpt-6.1-terra' }}
        run: uv run --frozen python -m seo_reviewer preflight --publish-dir site
      - name: Save immutable run evidence even when a probe fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-evidence-${{ github.run_attempt }}
          path: data/runs/
          if-no-files-found: error
          retention-days: 90
      - name: Save result for retryable Issue delivery
        uses: actions/upload-artifact@v7
        with:
          name: preflight-result-${{ github.run_attempt }}
          path: site/preflight.json
          if-no-files-found: error
      - name: Enforce checks when not deploying a smoke page
        if: ${{ !inputs.publish_smoke && steps.probe.outcome != 'success' }}
        run: exit 1
      - name: Package Pages smoke test
        if: inputs.publish_smoke
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: inputs.publish_smoke
    needs: probe
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  notify:
    needs: [probe, deploy]
    if: ${{ always() && !cancelled() && needs.probe.result == 'success' && inputs.publish_smoke }}
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          python-version: "3.13"
      - run: uv sync --locked
      # No attempt filter: a retry of only this job reuses the saved result.
      - uses: actions/download-artifact@v8
        with:
          pattern: preflight-result-*
          path: downloaded
      - name: Deliver preflight result and enforce integration gate
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          DEPLOYMENT_RESULT: ${{ needs.deploy.result }}
        run: |
          evidence=$(uv run --frozen python -c 'from pathlib import Path; from seo_reviewer.notification import latest_preflight; print(latest_preflight(Path("downloaded")))')
          uv run --frozen python -m seo_reviewer.notification --evidence "$evidence" --pages-url "$PAGES_URL" --deployment-result "$DEPLOYMENT_RESULT"
