name: Collect SEO observations

on:
  workflow_dispatch:

concurrency:
  group: daily-seo-reviewer-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    # Persist state only on the default branch; do not create diverging cohorts.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --frozen pytest
      - name: Collect cohort and new URLs
        id: crawl
        continue-on-error: true
        run: uv run --frozen python -m seo_reviewer run
      - name: Preserve evidence and comparison state
        if: always() && (steps.crawl.outcome == 'success' || steps.crawl.outcome == 'failure')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/runs data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save SEO collection evidence and comparison state'
            git push
          fi
      - name: Upload collected evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/runs/
            data/state.json
          if-no-files-found: error
          retention-days: 90
      - name: Expose collection failure
        if: steps.crawl.outcome == 'failure'
        run: exit 1
